name: Feed manager isolated tests
on:
  push:
    branches: [feature/feeds-other-channels]
    paths:
      - 'patches/worker/feeds/**'
      - 'patches/worker/tests/**'
      - '.github/workflows/feed-manager-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest requests fastapi
      - run: python -m compileall -q patches/worker/feeds
      - name: Offline feed regression tests
        env:
          PYTHONPATH: patches/worker
        run: python -m pytest -q patches/worker/tests/test_feed_quality.py patches/worker/tests/test_category_mapping.py patches/worker/tests/test_feed_ids.py patches/worker/tests/test_shopify_translations.py patches/worker/tests/test_market_feed_rows.py patches/worker/tests/test_durable_journal.py patches/worker/tests/test_batch_job.py patches/worker/tests/test_xml_audit.py
